    depends_on:
      - mongodb
      - redis
    networks:
      - ntreat-net

  http_security-service:
    build:
      context: ./backend
    container_name: ntreat-http_security-service
    command: bash -c "cd http_security_service && python app.py"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/ntreat
      - REDIS_URL=redis://redis:6379/0
      - ORCHRESTATOR_SERVICE_URL=http://orchrestator:5011
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5010/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - mongodb
      - redis
    networks:
