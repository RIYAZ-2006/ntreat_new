      - mongodb
      - redis
    networks:
      - ntreat-net

  # Frontend
  frontend:
    build:
      context: ./frontend
    container_name: ntreat-frontend
    ports:
      - "5173:80"
    depends_on:
      - api-gateway
    networks:
      - ntreat-net

networks:
  ntreat-net:
    driver: bridge

volumes:
  ntreat-db: